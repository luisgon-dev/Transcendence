name: CI (Web + Backend)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Backend Tests
        run: dotnet test Transcendence.sln -v minimal

  modeler:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: analytics/modeler

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every other action in this repo is SHA-pinned; rather than add an unpinned
      # actions/setup-python, use the runner's own interpreter (ubuntu-latest ships >= 3.12,
      # which is what pyproject.toml requires — a runner image that drops below it fails here
      # loudly at install time). A venv keeps the install off the externally-managed system
      # site-packages.
      - name: Create virtualenv
        run: python3 -m venv .venv

      - name: Install modeler with test extra
        run: .venv/bin/python -m pip install --disable-pip-version-check -e '.[test]'

      - name: Modeler Tests
        run: .venv/bin/python -m pytest

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI + Client Are Up To Date
        run: pnpm api:check

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Frontend performance budgets
        run: pnpm perf:web:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
          retention-days: 14

  performance-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcendence_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "1.3.0"

      - name: Build and migrate performance stack
        env:
          ConnectionStrings__MainDatabase: "Host=localhost;Port=5432;Database=transcendence_perf;Username=postgres;Password=postgres"
          ConnectionStrings__Redis: "localhost:6379"
          Database__AutoMigrate: "false"
        run: |
          dotnet tool restore
          dotnet build Transcendence.sln -c Release
          dotnet ef database update \
            --project Transcendence.Service \
            --startup-project Transcendence.Service \
            --configuration Release \
            --no-build

      - name: Seed representative leaderboard data
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d transcendence_perf -f scripts/perf/seed-leaderboard.sql

      - name: Start WebAPI
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: "http://127.0.0.1:8080"
          ConnectionStrings__MainDatabase: "Host=localhost;Port=5432;Database=transcendence_perf;Username=postgres;Password=postgres;Application Name=transcendence-performance-ci;Maximum Pool Size=20;Minimum Pool Size=0"
          ConnectionStrings__Redis: "localhost:6379"
          Database__AutoMigrate: "false"
        run: |
          mkdir -p .performance-artifacts
          dotnet run \
            --project Transcendence.WebAPI/Transcendence.WebAPI.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > .performance-artifacts/webapi.log 2>&1 &
          echo "$!" > .performance-artifacts/webapi.pid

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat .performance-artifacts/webapi.log
          exit 1

      - name: API load budgets
        run: >-
          k6 run
          --summary-export .performance-artifacts/k6-summary.json
          -e BASE_URL=http://127.0.0.1:8080
          scripts/perf/api-load.js

      - name: Stop WebAPI
        if: always()
        run: |
          if [[ -f .performance-artifacts/webapi.pid ]]; then
            kill "$(cat .performance-artifacts/webapi.pid)" 2>/dev/null || true
          fi

      - name: Upload API performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-performance-reports
          path: .performance-artifacts
          if-no-files-found: ignore
          retention-days: 14

  migration-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Fails the PR if a newly-added migration write-locks/rewrites a hot table
      # (Summoners/Matches/MatchParticipants). See docs/DEVELOPMENT.md.
      - name: Hot-table DDL lint (newly-added migrations)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash scripts/ci/check-migrations.sh

      # Fails if the EF model and the latest migration snapshot have drifted
      # (an entity changed without a migration → deployed code expects columns
      # the schema lacks). Prod DOES auto-migrate on worker startup
      # (Database:AutoMigrate=true), so drift or a bad migration would auto-apply —
      # which is exactly why the hot-table DDL gate above and the migration-apply
      # job (full chain vs a real Postgres) matter.
      - name: Model/snapshot drift check
        run: |
          dotnet tool restore
          # Build the whole solution (a clean standalone build of Transcendence.Service
          # trips MSB3552 on the resx glob; the solution build is the known-good path the
          # backend job uses), then run EF against that output with --no-build.
          dotnet build Transcendence.sln -c Debug
          dotnet ef migrations has-pending-model-changes \
            --project Transcendence.Service --startup-project Transcendence.Service --no-build

  migration-apply:
    runs-on: ubuntu-latest

    # Prod auto-migrates on worker startup (Database:AutoMigrate); a migration that compiles and
    # passes the drift check but fails at RUNTIME (PG-specific DDL, ordering, or type error) would
    # crash-loop the worker while the deploy reports success. The SQLite/InMemory tests can't catch
    # that. This job applies the full migration chain from empty against real PostgreSQL so those
    # failures surface pre-merge. See docs/DEVELOPMENT.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcendence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Apply full migration chain to a fresh Postgres
        env:
          # Overrides config/backend.shared.json's localhost default for the CI service container.
          ConnectionStrings__MainDatabase: "Host=localhost;Port=5432;Database=transcendence_ci;Username=postgres;Password=postgres"
          Database__AutoMigrate: "false"
        run: |
          dotnet tool restore
          # Solution build first (same reason as the drift check above), then apply with --no-build.
          dotnet build Transcendence.sln -c Debug
          dotnet ef database update \
            --project Transcendence.Service --startup-project Transcendence.Service --no-build

      - name: Seed representative rows (schema-accepts-writes smoke)
        env:
          PGPASSWORD: postgres
        # The empty-DB migration above catches DDL / ordering / type errors; this additionally proves
        # the migrated schema accepts a realistic write. RefreshLocks has a stable, self-owned schema
        # so this stays low-maintenance. (Full data-dependent migration coverage — apply-N-1, seed,
        # apply-N — is a follow-up on the integration tier.)
        run: |
          psql -h localhost -U postgres -d transcendence_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "RefreshLocks" ("Id", "Key", "CreatedAtUtc", "LockedUntilUtc", "OwnerToken")
          VALUES (gen_random_uuid(), 'ci-seed:smoke', now(), now() + interval '1 minute', gen_random_uuid());
          SELECT count(*) AS refresh_locks_seeded FROM "RefreshLocks";
          SQL

      # The modeler is Python and its queries never go through EF, so nothing above touches them --
      # yet they run against exactly this schema in prod. Two generations died on SQL that every
      # unit test passed (`Connection.executemany`, and `incomplete placeholder: '%'` from a comment
      # reading "~16%"), because a test double accepts what psycopg rejects. Reusing this job's
      # migrated database rather than standing up a fixture is the point: a fixture is a copy of the
      # schema that drifts from it, which is the same class of bug one level up.
      - name: Run modeler queries against the migrated schema
        working-directory: analytics/modeler
        env:
          MODELER_TEST_DSN: "postgresql://postgres:postgres@localhost:5432/transcendence_ci"
          # Turns a missing/unreachable DSN into a hard failure instead of a quiet skip.
          MODELER_REQUIRE_DB: "1"
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e '.[test]'
          .venv/bin/python -m pytest tests/test_real_schema.py -q
