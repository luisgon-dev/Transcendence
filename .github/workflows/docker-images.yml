name: Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    uses: ./.github/workflows/ci-web-backend.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: webapi
            image_suffix: webapi
            dockerfile: ./Transcendence.WebAPI/Dockerfile
            filter_key: webapi
          - component: service
            image_suffix: service
            dockerfile: ./Transcendence.Service/Dockerfile
            filter_key: service
          - component: web
            image_suffix: web
            dockerfile: ./apps/web/Dockerfile
            filter_key: web
          - component: perf
            image_suffix: perf
            dockerfile: ./scripts/perf/Dockerfile
            filter_key: perf

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: changes
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/component-inputs.json

      - name: Plan component build
        id: plan
        shell: bash
        env:
          WEBAPI_CHANGED: ${{ steps.changes.outputs.webapi }}
          SERVICE_CHANGED: ${{ steps.changes.outputs.service }}
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
          PERF_CHANGED: ${{ steps.changes.outputs.perf }}
        run: |
          # A main release always describes a complete, jointly tested application stack.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" || "${{ matrix.component }}" != "perf" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run="false"
          case "${{ matrix.filter_key }}" in
            webapi)
              run="${WEBAPI_CHANGED:-false}"
              ;;
            service)
              run="${SERVICE_CHANGED:-false}"
              ;;
            web)
              run="${WEB_CHANGED:-false}"
              ;;
            perf)
              run="${PERF_CHANGED:-false}"
              ;;
          esac

          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Skip unchanged component
        if: steps.plan.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.component }}; no relevant changes detected."

      - name: Install cosign
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.6.3"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.plan.outputs.run == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}
          # `:main` stays the moving tag the digest poller follows; `:sha-<short>`
          # is an immutable per-commit handle used for break-glass rollback (see
          # docs/ARCHITECTURE.md "Deployment & rollback").
          tags: |
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' || matrix.component == 'perf' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        id: build-and-push
        if: steps.plan.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' && (matrix.component == 'webapi' || matrix.component == 'service') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ matrix.dockerfile }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          # The systemd poller resolves the top-level OCI digest explicitly and supports
          # attestation sub-manifests, so publish both build provenance and an SBOM.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test published backend runtime
        if: github.event_name == 'pull_request' && steps.plan.outputs.run == 'true' && (matrix.component == 'webapi' || matrix.component == 'service')
        run: bash scripts/ci/backend-runtime-smoke.sh '${{ matrix.component }}' '${{ steps.build-and-push.outputs.imageid }}'

      - name: Sign the published Docker image
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Record exact release image
        if: github.ref == 'refs/heads/main' && matrix.component != 'perf'
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          mkdir -p release-images
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          component = os.environ['COMPONENT']
          image = f"ghcr.io/luisgon-dev/transcendence-{component}@{os.environ['DIGEST']}"
          Path(f'release-images/{component}.json').write_text(json.dumps(dict(image=image, revision=os.environ['GITHUB_SHA'])))
          PY

      - name: Upload release image identity
        if: github.ref == 'refs/heads/main' && matrix.component != 'perf'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.component }}
          path: release-images/*.json
          retention-days: 7

  release:
    # No host follows moving component tags in the coordinated deployment path.
    # A complete release is published only after every build/sign step and exact-image staging pass.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check immutable release publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "release-$GITHUB_SHA" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.publication.outputs.complete != 'true'
        with:
          cosign-release: "v2.6.3"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.publication.outputs.complete != 'true'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.publication.outputs.complete != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release contract and tooling
        if: steps.publication.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'release-image-*' --dir release-records
          python3 scripts/ci/build-release.py --revision "$GITHUB_SHA" --records release-records --output release-output
          mkdir release-bundle
          tar -xzf release-output/release.tgz -C release-bundle
      - name: Test the exact production artifacts in isolation
        if: steps.publication.outputs.complete != 'true'
        run: python3 release-bundle/scripts/ops/release_deploy.py stage --bundle release-bundle --state "$RUNNER_TEMP/release-stage"
      - name: Sign the complete configuration and image contract
        if: steps.publication.outputs.complete != 'true'
        run: cosign sign-blob --yes --bundle release-output/release.sigstore.json release-output/release.tgz
      - name: Verify the host bootstrap signature contract
        if: steps.publication.outputs.complete != 'true'
        run: >-
          cosign verify-blob --bundle release-output/release.sigstore.json
          --certificate-identity 'https://github.com/luisgon-dev/Transcendence/.github/workflows/docker-images.yml@refs/heads/main'
          --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          release-output/release.tgz
      - name: Publish complete release
        if: steps.publication.outputs.complete != 'true'
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="release-$GITHUB_SHA"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo 'Superseded build; leaving the production release unchanged.'
            exit 0
          fi
          gh release view "$release_tag" >/dev/null 2>&1 || gh release create "$release_tag" --target "$GITHUB_SHA" --draft --title "$release_tag" --notes 'Verified application images, configuration, and deployment tooling. Database rollback is application-only.'
          [[ "$(gh release view "$release_tag" --json isDraft --jq '.isDraft')" == true ]]
          gh release upload "$release_tag" --clobber release-output/release.tgz release-output/release.json release-output/release.sigstore.json
          gh release edit "$release_tag" --draft=false --latest
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Advance legacy aliases after complete release publication
        if: steps.promote.outputs.published == 'true'
        # Compatibility during host migration. Coordinated deployments consume only the bundle.
        run: |
          while IFS= read -r image; do
            docker buildx imagetools create --tag "${image%@*}:main" "$image"
          done < <(python3 -c 'import json; print("\n".join(json.load(open("release-output/release.json"))["images"].values()))')
