name: Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: webapi
            image_suffix: webapi
            dockerfile: ./Transcendence.WebAPI/Dockerfile
            filter_key: webapi
          - component: service
            image_suffix: service
            dockerfile: ./Transcendence.Service/Dockerfile
            filter_key: service
          - component: web
            image_suffix: web
            dockerfile: ./apps/web/Dockerfile
            filter_key: web
          - component: analytics-modeler
            image_suffix: analytics-modeler
            dockerfile: ./analytics/modeler/Dockerfile
            filter_key: modeler

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: changes
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            webapi:
              - 'Transcendence.WebAPI/**'
              - 'Transcendence.Service.Core/**'
              - 'Transcendence.Data/**'
              - 'Transcendence.Service/**'
              - 'global.json'
              - 'Transcendence.sln'
              - 'Transcendence.WebAPI/Dockerfile'
              - '.github/workflows/docker-images.yml'
            service:
              - 'Transcendence.Service/**'
              - 'Transcendence.Service.Core/**'
              - 'Transcendence.Data/**'
              - 'global.json'
              - 'Transcendence.sln'
              - 'Transcendence.Service/Dockerfile'
              - '.github/workflows/docker-images.yml'
            web:
              - 'apps/web/**'
              - 'openapi/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'apps/web/Dockerfile'
              - '.github/workflows/docker-images.yml'
            modeler:
              - 'analytics/modeler/**'
              - '.github/workflows/docker-images.yml'

      - name: Plan component build
        id: plan
        shell: bash
        env:
          WEBAPI_CHANGED: ${{ steps.changes.outputs.webapi }}
          SERVICE_CHANGED: ${{ steps.changes.outputs.service }}
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
          MODELER_CHANGED: ${{ steps.changes.outputs.modeler }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run="false"
          case "${{ matrix.filter_key }}" in
            webapi)
              run="${WEBAPI_CHANGED:-false}"
              ;;
            service)
              run="${SERVICE_CHANGED:-false}"
              ;;
            web)
              run="${WEB_CHANGED:-false}"
              ;;
            modeler)
              run="${MODELER_CHANGED:-false}"
              ;;
          esac

          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Skip unchanged component
        if: steps.plan.outputs.run != 'true'
        run: echo "Skipping ${{ matrix.component }}; no relevant changes detected."

      - name: Install cosign
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.plan.outputs.run == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image_suffix }}
          # `:main` stays the moving tag the digest poller follows; `:sha-<short>`
          # is an immutable per-commit handle used for break-glass rollback (see
          # docs/ARCHITECTURE.md "Deployment & rollback").
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        id: build-and-push
        if: steps.plan.outputs.run == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ matrix.dockerfile }}
          # The systemd poller resolves the top-level OCI digest explicitly and supports
          # attestation sub-manifests, so publish both build provenance and an SBOM.
          provenance: mode=max
          sbom: true

      - name: Sign the published Docker image
        if: steps.plan.outputs.run == 'true' && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
