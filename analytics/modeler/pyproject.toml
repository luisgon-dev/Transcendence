[project]
name = "transcendence-build-lab-modeler"
version = "0.1.0"
description = "Offline calibrated win-probability and adjusted action-value pipeline."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<21",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "threadpoolctl>=3.5,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
