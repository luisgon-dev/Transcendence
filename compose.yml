name: transcendence

x-app-env: &app-env
  ConnectionStrings__Redis: ${REDIS_CONNECTION}
  RiotApi__League__ApiKey: ${RIOT_API_KEY_LOL}

services:
  postgres:
    # Mirrors the prod stack so this file is a safe deploy source: pgautoupgrade (runs pg_upgrade across
    # major versions in place) on Postgres 18, with the data volume mounted at /var/lib/postgresql —
    # pgautoupgrade keeps PGDATA under /var/lib/postgresql/<major>/docker, NOT /var/lib/postgresql/data
    # like the stock postgres image, so the mount path must match the image. NOTE: an existing local
    # postgres:16 volume won't auto-migrate cleanly across this image+mount change — remove it first
    # (`docker compose down -v`, or `docker volume rm transcendence_postgres_data`) for a clean PG18 init.
    image: pgautoupgrade/pgautoupgrade:18.3-alpine
    container_name: transcendence-postgres
    restart: unless-stopped
    # Memory tuning is declarative (passed as `postgres -c`) so it survives a postgres_data volume
    # rebuild and is version-controlled, rather than living only in ALTER SYSTEM / postgresql.auto.conf
    # inside the volume (the 2026-06-21 DB-saturation incident fix). Defaults match Postgres/Docker
    # out-of-box, so local `docker compose up` is unchanged — do NOT raise them for a local DB on a small
    # Docker VM. The prod stack pins the real values (shared_buffers=4GB etc.) directly in its Portainer
    # compose command as a failsafe; a deploy of THIS file must set the POSTGRES_* vars (.env.example) or
    # it falls back to Postgres defaults. See scripts/ops/README.md ("Postgres memory tuning"). -c options
    # take precedence over postgresql.auto.conf, so they're authoritative once auto.conf is reset on prod.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}"
      - "-c"
      - "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}"
      - "-c"
      - "log_temp_files=${POSTGRES_LOG_TEMP_FILES_KB:-65536}"
    shm_size: "${POSTGRES_SHM_SIZE:-64mb}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transcendence-net

  redis:
    image: redis:7-alpine
    container_name: transcendence-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transcendence-net

  web:
    image: ${WEB_IMAGE:-ghcr.io/luisgon-dev/transcendence-web:main}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: transcendence-web
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${WEB_CPUS:-2.0}"
    mem_limit: "${WEB_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: 3000
      TRN_BACKEND_BASE_URL: http://webapi:8080
      TRN_BACKEND_API_KEY: ${WEB_TRN_BACKEND_API_KEY}
      # Safe is the production default. Set TRN_ERROR_VERBOSITY=verbose only for a short-lived
      # local debugging session; verbose mode can expose upstream/internal failure detail.
      TRN_ERROR_VERBOSITY: ${TRN_ERROR_VERBOSITY:-safe}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - transcendence-net

  operational-logs-init:
    # Named volumes are created as root:root. The .NET images run as their non-root APP_UID,
    # so prepare the shared log directory before either writer starts. Reusing the WebAPI image
    # keeps the ownership target tied to the image's APP_UID instead of hard-coding a numeric UID.
    image: ${WEBAPI_IMAGE:-ghcr.io/luisgon-dev/transcendence-webapi:main}
    build:
      context: .
      dockerfile: Transcendence.WebAPI/Dockerfile
    container_name: transcendence-operational-logs-init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'chown -R "$${APP_UID}:$${APP_UID}" /var/log/transcendence && chmod 0755 /var/log/transcendence'
    volumes:
      - operational_logs:/var/log/transcendence

  webapi:
    image: ${WEBAPI_IMAGE:-ghcr.io/luisgon-dev/transcendence-webapi:main}
    build:
      context: .
      dockerfile: Transcendence.WebAPI/Dockerfile
    container_name: transcendence-webapi
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${WEBAPI_CPUS:-4.0}"
    mem_limit: "${WEBAPI_MEMORY_LIMIT:-2g}"
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Auth__Jwt__Issuer: ${JWT_ISSUER}
      Auth__Jwt__Audience: ${JWT_AUDIENCE}
      Auth__Jwt__Key: ${JWT_SIGNING_KEY}
      Auth__Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Auth__AdminBootstrap__Emails__0: ${ADMIN_BOOTSTRAP_EMAIL_0:-}
      Auth__BootstrapApiKey: ${AUTH_BOOTSTRAP_API_KEY}
      Auth__PasswordReset__Enabled: ${PASSWORD_RESET_ENABLED:-false}
      Auth__PasswordReset__PublicBaseUrl: ${PASSWORD_RESET_PUBLIC_BASE_URL:-https://transcend.kronic.one}
      Auth__PasswordReset__TokenLifetimeMinutes: ${PASSWORD_RESET_TOKEN_LIFETIME_MINUTES:-30}
      Auth__PasswordReset__Smtp__Host: ${PASSWORD_RESET_SMTP_HOST:-}
      Auth__PasswordReset__Smtp__Port: ${PASSWORD_RESET_SMTP_PORT:-587}
      Auth__PasswordReset__Smtp__EnableSsl: ${PASSWORD_RESET_SMTP_ENABLE_SSL:-true}
      Auth__PasswordReset__Smtp__Username: ${PASSWORD_RESET_SMTP_USERNAME:-}
      Auth__PasswordReset__Smtp__Password: ${PASSWORD_RESET_SMTP_PASSWORD:-}
      Auth__PasswordReset__Smtp__FromAddress: ${PASSWORD_RESET_SMTP_FROM_ADDRESS:-}
      Auth__PasswordReset__Smtp__FromName: ${PASSWORD_RESET_SMTP_FROM_NAME:-Transcendence}
      Auth__RiotRso__Enabled: ${RIOT_RSO_ENABLED:-false}
      Auth__RiotRso__ClientId: ${RIOT_RSO_CLIENT_ID:-}
      Auth__RiotRso__ClientSecret: ${RIOT_RSO_CLIENT_SECRET:-}
      Auth__RiotRso__RedirectUri: ${RIOT_RSO_REDIRECT_URI:-https://transcend.kronic.one/api/session/riot/callback}
      OperationalLogs__DirectoryPath: /var/log/transcendence
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Application Name=transcendence-webapi;Maximum Pool Size=${WEBAPI_DB_POOL_MAX:-20};Minimum Pool Size=0
      <<: *app-env
    ports:
      - "${WEBAPI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      operational-logs-init:
        condition: service_completed_successfully
    volumes:
      - operational_logs:/var/log/transcendence
    networks:
      - transcendence-net

  service:
    image: ${SERVICE_IMAGE:-ghcr.io/luisgon-dev/transcendence-service:main}
    build:
      context: .
      dockerfile: Transcendence.Service/Dockerfile
    container_name: transcendence-service
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${SERVICE_CPUS:-8.0}"
    mem_limit: "${SERVICE_MEMORY_LIMIT:-6g}"
    pids_limit: 1024
    environment:
      DOTNET_ENVIRONMENT: Production
      OperationalLogs__DirectoryPath: /var/log/transcendence
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Application Name=transcendence-worker;Maximum Pool Size=${SERVICE_DB_POOL_MAX:-35};Minimum Pool Size=0
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      operational-logs-init:
        condition: service_completed_successfully
    volumes:
      - operational_logs:/var/log/transcendence
    networks:
      - transcendence-net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: transcendence-pgadmin
    restart: unless-stopped
    profiles: ["local-tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: transcendence-dozzle
    restart: unless-stopped
    profiles: ["ops-tools"]
    environment:
      DOZZLE_TAILSIZE: "300"
      DOZZLE_LEVEL: info
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - transcendence-net

  # Prometheus + Grafana now live in their own stack — the single source of truth for both local
  # dev and prod — at config/monitoring/ (compose.yml + compose.prod.yml). They share this app
  # network so Prometheus can scrape webapi/service by name. See config/monitoring/README.md.

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  operational_logs:

networks:
  transcendence-net:
    driver: bridge
