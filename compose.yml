name: transcendence

x-app-env: &app-env
  ConnectionStrings__Redis: ${REDIS_CONNECTION}
  RiotApi__League__ApiKey: ${RIOT_API_KEY_LOL}
  # Carried from the pre-Compose prod stack. Nothing binds RiotApi:Tft:ApiKey today -- the schema in
  # config/backend.shared.json declares only League -- but the TFT module's tables and migrations
  # exist, so this is kept rather than dropped during a migration whose rule is to change nothing.
  RiotApi__Tft__ApiKey: ${RIOT_API_KEY_TFT:-}

services:
  postgres:
    # Mirrors the prod stack so this file is a safe deploy source: pgautoupgrade (runs pg_upgrade across
    # major versions in place) on Postgres 18, with the data volume mounted at /var/lib/postgresql —
    # pgautoupgrade keeps PGDATA under /var/lib/postgresql/<major>/docker, NOT /var/lib/postgresql/data
    # like the stock postgres image, so the mount path must match the image. NOTE: an existing local
    # postgres:16 volume won't auto-migrate cleanly across this image+mount change — remove it first
    # (`docker compose down -v`, or `docker volume rm transcendence_postgres_data`) for a clean PG18 init.
    image: pgautoupgrade/pgautoupgrade:18.3-alpine
    container_name: transcendence-postgres
    labels:
      wud.watch: "false"
    restart: unless-stopped
    # Memory tuning is declarative (passed as `postgres -c`) so it survives a postgres_data volume
    # rebuild and is version-controlled, rather than living only in ALTER SYSTEM / postgresql.auto.conf
    # inside the volume (the 2026-06-21 DB-saturation incident fix). Defaults match Postgres/Docker
    # out-of-box, so local `docker compose up` is unchanged — do NOT raise them for a local DB on a small
    # Docker VM. The prod stack pins the real values (shared_buffers=4GB etc.) directly in its Portainer
    # compose command as a failsafe; a deploy of THIS file must set the POSTGRES_* vars (.env.example) or
    # it falls back to Postgres defaults. See scripts/ops/README.md ("Postgres memory tuning"). -c options
    # take precedence over postgresql.auto.conf, so they're authoritative once auto.conf is reset on prod.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-4MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}"
      - "-c"
      - "shared_preload_libraries=${POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}"
      - "-c"
      - "track_io_timing=${POSTGRES_TRACK_IO_TIMING:-on}"
      - "-c"
      - "log_temp_files=${POSTGRES_LOG_TEMP_FILES_KB:-65536}"
      # Parallel query. The defaults (8/8/2) are sized for a small server and were what prod ran on
      # a 46-core host: any one query got at most two helper workers, which is why a single backend
      # saturated while the machine idled. max_worker_processes needs a restart to change, so it is
      # set here rather than by ALTER SYSTEM. Keep max_parallel_workers <= max_worker_processes.
      - "max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}"
      - "max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-8}"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}"
      - "max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}"
    shm_size: "${POSTGRES_SHM_SIZE:-64mb}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transcendence-net

  redis:
    image: redis:7-alpine
    container_name: transcendence-redis
    labels:
      wud.watch: "false"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - transcendence-net

  web:
    image: ${WEB_IMAGE:-ghcr.io/luisgon-dev/transcendence-web:main}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: transcendence-web
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${WEB_CPUS:-2.0}"
    mem_limit: "${WEB_MEMORY_LIMIT:-1g}"
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: 3000
      # The canonical public origin. apps/web/lib/env.ts falls back to a build-time constant when
      # this is unset, so an omission is silent rather than fatal -- it must not be lost.
      TRN_PUBLIC_ORIGIN: ${TRN_PUBLIC_ORIGIN:-}
      TRN_BACKEND_BASE_URL: http://webapi:8080
      TRN_BACKEND_API_KEY: ${WEB_TRN_BACKEND_API_KEY}
      TRN_FEATURE_BUILD_LAB: ${TRN_FEATURE_BUILD_LAB:-false}
      TRN_FEATURE_CHAMPION_RECOMMENDATIONS: ${TRN_FEATURE_CHAMPION_RECOMMENDATIONS:-false}
      TRN_FEATURE_BUILD_REFERENCE_LINKS: ${TRN_FEATURE_BUILD_REFERENCE_LINKS:-false}
      # Safe is the production default. Set TRN_ERROR_VERBOSITY=verbose only for a short-lived
      # local debugging session; verbose mode can expose upstream/internal failure detail.
      TRN_ERROR_VERBOSITY: ${TRN_ERROR_VERBOSITY:-safe}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      webapi:
        condition: service_healthy
    networks:
      - transcendence-net

  operational-logs-init:
    # Named volumes are created as root:root. The .NET images run as their non-root APP_UID,
    # so prepare the shared log directory before either writer starts. Reusing the WebAPI image
    # keeps the ownership target tied to the image's APP_UID instead of hard-coding a numeric UID.
    image: ${WEBAPI_IMAGE:-ghcr.io/luisgon-dev/transcendence-webapi:main}
    build:
      context: .
      dockerfile: Transcendence.WebAPI/Dockerfile
    container_name: transcendence-operational-logs-init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'chown -R "$${APP_UID}:$${APP_UID}" /var/log/transcendence && chmod 0755 /var/log/transcendence'
    volumes:
      - operational_logs:/var/log/transcendence

  webapi:
    image: ${WEBAPI_IMAGE:-ghcr.io/luisgon-dev/transcendence-webapi:main}
    build:
      context: .
      dockerfile: Transcendence.WebAPI/Dockerfile
    container_name: transcendence-webapi
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${WEBAPI_CPUS:-4.0}"
    mem_limit: "${WEBAPI_MEMORY_LIMIT:-2g}"
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Auth__Jwt__Issuer: ${JWT_ISSUER}
      Auth__Jwt__Audience: ${JWT_AUDIENCE}
      Auth__Jwt__Key: ${JWT_SIGNING_KEY}
      Auth__Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES}
      Auth__AdminBootstrap__Emails__0: ${ADMIN_BOOTSTRAP_EMAIL_0:-}
      Auth__BootstrapApiKey: ${AUTH_BOOTSTRAP_API_KEY}
      Auth__PasswordReset__Enabled: ${PASSWORD_RESET_ENABLED:-false}
      Auth__PasswordReset__PublicBaseUrl: ${PASSWORD_RESET_PUBLIC_BASE_URL:-https://transcend.kronic.one}
      Auth__PasswordReset__TokenLifetimeMinutes: ${PASSWORD_RESET_TOKEN_LIFETIME_MINUTES:-30}
      Auth__PasswordReset__Smtp__Host: ${PASSWORD_RESET_SMTP_HOST:-}
      Auth__PasswordReset__Smtp__Port: ${PASSWORD_RESET_SMTP_PORT:-587}
      Auth__PasswordReset__Smtp__EnableSsl: ${PASSWORD_RESET_SMTP_ENABLE_SSL:-true}
      Auth__PasswordReset__Smtp__Username: ${PASSWORD_RESET_SMTP_USERNAME:-}
      Auth__PasswordReset__Smtp__Password: ${PASSWORD_RESET_SMTP_PASSWORD:-}
      Auth__PasswordReset__Smtp__FromAddress: ${PASSWORD_RESET_SMTP_FROM_ADDRESS:-}
      Auth__PasswordReset__Smtp__FromName: ${PASSWORD_RESET_SMTP_FROM_NAME:-Transcendence}
      Auth__RiotRso__Enabled: ${RIOT_RSO_ENABLED:-false}
      Auth__RiotRso__ClientId: ${RIOT_RSO_CLIENT_ID:-}
      Auth__RiotRso__ClientSecret: ${RIOT_RSO_CLIENT_SECRET:-}
      Auth__RiotRso__RedirectUri: ${RIOT_RSO_REDIRECT_URI:-https://transcend.kronic.one/api/session/riot/callback}
      OperationalLogs__DirectoryPath: /var/log/transcendence
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Application Name=transcendence-webapi;Maximum Pool Size=${WEBAPI_DB_POOL_MAX:-20};Minimum Pool Size=0
      # The serving layer reads the same flag: BuildLabService answers "not enabled" without it, so
      # the API would stay dark even after a generation was promoted by the worker.
      Analytics__BuildLab__Enabled: ${BUILD_LAB_ENABLED:-false}
      <<: *app-env
    ports:
      - "${WEBAPI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      operational-logs-init:
        condition: service_completed_successfully
    volumes:
      - operational_logs:/var/log/transcendence
    networks:
      - transcendence-net

  service:
    image: ${SERVICE_IMAGE:-ghcr.io/luisgon-dev/transcendence-service:main}
    build:
      context: .
      dockerfile: Transcendence.Service/Dockerfile
    container_name: transcendence-service
    labels:
      wud.watch: "false"
    restart: unless-stopped
    cpus: "${SERVICE_CPUS:-8.0}"
    mem_limit: "${SERVICE_MEMORY_LIMIT:-6g}"
    pids_limit: 1024
    environment:
      DOTNET_ENVIRONMENT: Production
      OperationalLogs__DirectoryPath: /var/log/transcendence
      ConnectionStrings__MainDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Application Name=transcendence-worker;Maximum Pool Size=${SERVICE_DB_POOL_MAX:-35};Minimum Pool Size=0
      Analytics__BuildLab__Enabled: ${BUILD_LAB_ENABLED:-false}
      Analytics__BuildLab__CodeRevision: ${BUILD_LAB_CODE_REVISION:-local}
      Jobs__Schedule__EnableCreateBuildLabGeneration: ${BUILD_LAB_ENABLED:-false}
      # Cadence of the create job. A generation now takes hours rather than days, but a daily cron
      # can still queue them faster than they are consumed -- patch-aligned matches reality.
      Jobs__Schedule__CreateBuildLabGenerationCron: ${BUILD_LAB_CREATE_CRON:-15 2 * * *}
      # Worker-stall and job-failure alerts. Program.cs logs instead of posting when unset, so a
      # dropped value degrades silently to no alerting at all.
      Alerts__Webhook__Url: ${ALERTS_WEBHOOK_URL:-}
      Jobs__Schedule__EnablePromoteBuildLabGeneration: ${BUILD_LAB_ENABLED:-false}
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      operational-logs-init:
        condition: service_completed_successfully
    volumes:
      - operational_logs:/var/log/transcendence
    networks:
      - transcendence-net

  # Run-to-completion, NOT a daemon. Invoked as `docker compose run --rm analytics-modeler` by
  # scripts/ops/transcendence-modeler.{service,timer}; a modeling run takes hours, and while this was
  # a long-lived container every image update recreated it mid-run and lost the generation. A process
  # that exits on its own is deployed *between* runs instead of through one, and the exit code is the
  # completion signal, so no liveness protocol is needed at all.
  #
  # Overlap is safe without extra machinery: a second invocation cannot take the modeling advisory
  # lock and exits idle.
  analytics-modeler:
    image: ${MODELER_IMAGE:-ghcr.io/luisgon-dev/transcendence-analytics-modeler:main}
    build:
      context: .
      dockerfile: analytics/modeler/Dockerfile
    labels:
      wud.watch: "false"
    # No restart policy and no container_name: `run --rm` supplies a fresh container per invocation,
    # and a restart policy on a oneshot would relaunch a finished run.
    restart: "no"
    profiles: ["analytics-modeling"]
    cpus: "${BUILD_LAB_MODELER_CPUS:-8.0}"
    # Peak is roughly (largest champion's frames x sweep workers) + one training slice + one shared
    # read of the cohort event state. It does track corpus growth, contrary to what this comment
    # used to claim: measured on prod, a single-worker sweep peaked at 3.46 GiB against an 88k-match
    # cohort in August and 5.32 GiB against 193k -- 89% of the old 6g cap, on the run that swept all
    # 173 champions. Size this against the cpu quota above, and re-check it when the cohort doubles.
    mem_limit: "${BUILD_LAB_MODELER_MEMORY_LIMIT:-12g}"
    pids_limit: 512
    environment:
      BUILD_LAB_DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} application_name=transcendence-modeler
      # Required, >= 32 chars, and never committed: it keys the surrogate match/participant IDs in
      # the deidentified export. Rotating it re-pseudonymizes future exports.
      # Deliberately `:-` and not `:?`: Compose interpolates the whole file before it filters by
      # profile, so a required-variable form here would break `docker compose up` for the DEFAULT
      # stack on any host that has no salt. The modeler itself refuses to start without a >=32-char
      # value (Settings.from_env), so the failure stays scoped to the container that needs the secret.
      BUILD_LAB_DEIDENTIFICATION_SALT: ${BUILD_LAB_DEIDENTIFICATION_SALT:-}
      BUILD_LAB_ARTIFACT_DIR: /artifacts
      BUILD_LAB_POLL_SECONDS: ${BUILD_LAB_POLL_SECONDS:-300}
      # One generation per invocation, then exit. The scheduler decides cadence.
      BUILD_LAB_RUN_ONCE: ${BUILD_LAB_RUN_ONCE:-true}
      BUILD_LAB_MAX_TRAINING_ROWS: ${BUILD_LAB_MAX_TRAINING_ROWS:-250000}
      # Unset tracks the cpu quota above. The sweep reads the cgroup rather than nproc, so this
      # container gets exactly the cpus it is given and never sizes pools against the host's 46.
      BUILD_LAB_SWEEP_WORKERS: ${BUILD_LAB_SWEEP_WORKERS:-}
      BUILD_LAB_SWEEP_BLAS_THREADS: ${BUILD_LAB_SWEEP_BLAS_THREADS:-1}
      # Session-scoped planner budget; the server's own settings stay sized for the web app.
      BUILD_LAB_SESSION_WORK_MEM: ${BUILD_LAB_SESSION_WORK_MEM:-128MB}
      BUILD_LAB_SESSION_PARALLEL_WORKERS: ${BUILD_LAB_SESSION_PARALLEL_WORKERS:-2}
      BUILD_LAB_FINE_SCOPE_MIN_ROWS: ${BUILD_LAB_FINE_SCOPE_MIN_ROWS:-1000}
      # How many whole matches the structural fit draws. The fit was always capped at
      # MAX_TRAINING_ROWS; this bounds the load that feeds it so the cap stops costing a full-corpus
      # read. Raise it for more match diversity in the fit, at a proportional memory cost.
      BUILD_LAB_TRAINING_SAMPLE_MATCHES: ${BUILD_LAB_TRAINING_SAMPLE_MATCHES:-12000}
      # BUILD_LAB_LEASE_OWNER is intentionally NOT set: the modeler derives `hostname:pid`, so two
      # instances can never claim the same lease identity.
      LOG_LEVEL: ${BUILD_LAB_LOG_LEVEL:-INFO}
      BUILD_LAB_S3_ENDPOINT: ${BUILD_LAB_S3_ENDPOINT:-}
      BUILD_LAB_S3_BUCKET: ${BUILD_LAB_S3_BUCKET:-}
      BUILD_LAB_S3_ACCESS_KEY: ${BUILD_LAB_S3_ACCESS_KEY:-}
      BUILD_LAB_S3_SECRET_KEY: ${BUILD_LAB_S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - build_lab_artifacts:/artifacts
    networks:
      - transcendence-net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: transcendence-pgadmin
    restart: unless-stopped
    profiles: ["local-tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transcendence-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: transcendence-dozzle
    restart: unless-stopped
    profiles: ["ops-tools"]
    environment:
      DOZZLE_TAILSIZE: "300"
      DOZZLE_LEVEL: info
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - transcendence-net

  # Carried over from the pre-Compose prod stack, deliberately unchanged.
  #
  # wud was the original auto-deployer and no longer is: wud 8.2.2 silently fails to resolve the
  # ghcr manifest digest for these packages (reports updateAvailable=false even when the digest
  # moved), which is why scripts/ops/poll-deploy.sh exists. Every app service is therefore labelled
  # `wud.watch=false` so the two can never race the same container (#143). What it still does is
  # report available updates for the third-party images nothing else watches, so it is kept.
  whatsupdocker:
    image: getwud/wud@sha256:2df7cafa0fc84cdd66ad976163abc5390fa5995e0b5788a90e6a5303706bc21a
    container_name: wud
    restart: unless-stopped
    profiles: ["ops-tools"]
    environment:
      WUD_TRIGGER_DOCKER_EXAMPLE_PRUNE: "true"
      WUD_WATCHER_LOCAL_CRON: "* * * * *"
    ports:
      - "${WUD_PORT:-3001}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Prometheus + Grafana now live in their own stack — the single source of truth for both local
  # dev and prod — at config/monitoring/ (compose.yml + compose.prod.yml). They share this app
  # network so Prometheus can scrape webapi/service by name. See config/monitoring/README.md.

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  operational_logs:
  build_lab_artifacts:

networks:
  transcendence-net:
    driver: bridge
