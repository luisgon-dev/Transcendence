[Unit]
Requires=transcendence-restore-docker.service
After=transcendence-restore-docker.service
RequiresMountsFor=/var/lib/transcendence-backup /mnt/transcendence-backups

[Service]
# Pre-stage the exact immutable recovery image in this daemon before activation.
Environment=DOCKER_HOST=unix:///run/transcendence-restore-docker.sock
ExecStopPost=-/usr/sbin/fstrim /var/lib/transcendence-backup
