# Prod overlay for the monitoring stack. Layer on top of compose.yml:
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# The base compose now requires the same file-backed Grafana admin password in every environment.
# Keep this overlay as a backwards-compatible no-op for the established prod deployment command;
# environment-specific root URLs, cookies, and webhooks remain driven from ./.env.
services:
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    volumes:
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
