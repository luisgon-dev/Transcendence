# Transcendence monitoring stack — the SINGLE source of truth for Prometheus + Grafana.
#
# This is the deployable unit for BOTH local dev and prod (prod runs it at
# /root/transcendence-monitoring — see README.md for the sync/deploy runbook). It is a *separate*
# stack from the app compose (repo-root compose.yml): the app owns web/webapi/service/postgres/redis;
# this owns observability. They share the app's Docker network (external `transcendence-net`) so
# Prometheus can scrape webapi/service by name.
#
# Local:  docker compose -f config/monitoring/compose.yml up -d          (needs the app network up)
# Prod:   docker compose -f compose.yml -f compose.prod.yml up -d        (overlay retained for compatibility)
#
# Environment-specific values come from ./.env (see .env.example); defaults here are local-friendly.
services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: transcendence-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    labels:
      # wud is retired for these; the poll-deploy pipeline does not manage the monitoring stack.
      wud.watch: "false"
    networks:
      - monitor

  grafana:
    image: grafana/grafana:13.1.0-25893932881-ubuntu
    container_name: transcendence-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Both local and prod fail closed on a file-backed password. Copy the committed example to
      # secrets/grafana_admin_password and replace its placeholder before starting this stack.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3300}"
      GF_SECURITY_COOKIE_SECURE: "${GRAFANA_COOKIE_SECURE:-false}"
      # Provisioned-alerting Discord/Slack webhook (interpolated into the discord contact point).
      # Grafana refuses to START if the contact point's URL is empty, so unset falls back to a no-op
      # placeholder (a valid-but-dead Discord URL): Grafana boots, alerts just don't deliver anywhere
      # real. Set DISCORD_ALERT_WEBHOOK_URL (prod: the worker's Alerts__Webhook__Url) for real delivery.
      DISCORD_ALERT_WEBHOOK_URL: "${DISCORD_ALERT_WEBHOOK_URL:-https://discord.com/api/webhooks/0/LOCAL_DEV_NO_OP}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    labels:
      wud.watch: "false"
    depends_on:
      - prometheus
    networks:
      - monitor

  # Host/CT filesystem + system metrics, so Prometheus can see disk usage and the "disk space low"
  # alert can page BEFORE a full disk crashes Postgres (as it did 2026-07-19). Mounts the host root
  # read-only and rewrites mountpoints via --path.rootfs so node_filesystem_* reflects the real disk.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: transcendence-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run|var/lib/docker)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$$"
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    labels:
      wud.watch: "false"
    networks:
      - monitor

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitor:
    # The app stack's network. Local: created by the repo-root compose (project `transcendence`).
    # Prod: the Portainer app stack's network. Bring the app up first.
    external: true
    name: ${MONITOR_NETWORK:-transcendence_transcendence-net}
