# Grafana provisioned alerting — metrics-based rules for the Transcendence stack.
#
# Grafana Alerting (not the dying worker) evaluates these against the Prometheus datasource, so an
# alert still pages when a target is down. Each rule is a two-stage query: refId A runs an *instant*
# PromQL query against the `prometheus` datasource; refId B is a Math expression that returns 1 (fire)
# / 0 (ok) and is the alert condition. Firing alerts route to the `transcendence-discord` contact
# point via per-rule notification_settings (leaving the default notification policy untouched).
#
# Coverage: WebAPI + worker liveness (up==0), API 5xx error ratio, API p95 latency. Postgres/Redis
# have no Prometheus target of their own (only webapi + worker are scraped), so their loss is covered
# *indirectly* — the worker crash-loops without the DB (→ WorkerDown) and DB/cache failures surface as
# API 5xx (→ ApiHighErrorRate). Add postgres_exporter/redis_exporter if dedicated DB/Redis-down
# alerts are ever needed.
apiVersion: 1

groups:
  - orgId: 1
    name: transcendence-platform
    folder: Transcendence
    interval: 1m
    rules:
      # --- WebAPI target down ---------------------------------------------------------------------
      - uid: trn-webapi-down
        title: WebAPI down
        condition: B
        for: 2m
        # A missing scrape target returns no series; treat that as down, not "unknown".
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-webapi"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Transcendence WebAPI is not reporting to Prometheus
          description: The transcendence-webapi target has been down (or unscrapeable) for over 2 minutes — the public API is likely unavailable.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Worker target down (also the DB/Redis-loss proxy) --------------------------------------
      - uid: trn-worker-down
        title: Worker down
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-worker"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Transcendence worker is not reporting to Prometheus
          description: The transcendence-worker target has been down for over 2 minutes — all ingestion/analytics jobs are halted. NB the worker crash-loops if Postgres is unreachable, so this also fires on a DB outage.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- API 5xx error ratio --------------------------------------------------------------------
      - uid: trn-api-5xx-ratio
        title: API 5xx error ratio high
        condition: B
        for: 5m
        # 0/0 (no traffic) yields NaN → no data → not an incident.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(rate(http_server_request_duration_seconds_count{job="transcendence-webapi",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="transcendence-webapi"}[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: WebAPI 5xx error ratio above 5%
          description: More than 5% of WebAPI responses have been 5xx for over 5 minutes — a backend fault (often DB/Redis) is degrading the API.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- API p95 latency ------------------------------------------------------------------------
      - uid: trn-api-latency-p95
        title: API p95 latency high
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="transcendence-webapi"}[5m])))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 1.5
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: WebAPI p95 request latency above 1.5s
          description: The WebAPI 95th-percentile request duration has exceeded 1.5s for over 10 minutes — reads are degraded.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Host disk space low (node-exporter) ----------------------------------------------------
      # Pages BEFORE a full disk crash-loops Postgres (2026-07-19 incident). Takes the fullest real
      # filesystem's free ratio; fires under 15% free (>85% used) for 15m of slow-fill headroom.
      - uid: trn-disk-space-low
        title: Host disk space low
        condition: B
        for: 15m
        # If node-exporter is unreachable this rule can't judge disk — stay quiet (a separate concern),
        # don't misreport "disk low".
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: min(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) * 100
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 15
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Host disk space below 15% free
          description: A host filesystem has under 15% free space for over 15 minutes. Free space (prune images, expand the CT disk via `pct resize`, or archive/prune old-patch match data) before Postgres runs out and crash-loops.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder
