# Grafana provisioned alerting — metrics-based rules for the Transcendence stack.
#
# Grafana Alerting (not the dying worker) evaluates these against the Prometheus datasource, so an
# alert still pages when a target is down. Each rule is a two-stage query: refId A runs an *instant*
# PromQL query against the `prometheus` datasource; refId B is a Math expression that returns 1 (fire)
# / 0 (ok) and is the alert condition. Firing alerts route to the `transcendence-discord` contact
# point via per-rule notification_settings (leaving the default notification policy untouched).
#
# Coverage: web, WebAPI, worker, Postgres exporter, and Redis exporter liveness; PostgreSQL connection
# saturation; Redis rejected connections; API errors/latency; browser Web Vitals; matchup generation
# failures/freshness; and host disk capacity.
apiVersion: 1

groups:
  - orgId: 1
    name: transcendence-platform
    folder: Transcendence
    interval: 1m
    rules:
      # --- WebAPI target down ---------------------------------------------------------------------
      - uid: trn-webapi-down
        title: WebAPI down
        condition: B
        for: 2m
        # A missing scrape target returns no series; treat that as down, not "unknown".
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-webapi"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Transcendence WebAPI is not reporting to Prometheus
          description: The transcendence-webapi target has been down (or unscrapeable) for over 2 minutes — the public API is likely unavailable.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Matchup generation freshness -----------------------------------------------------------
      - uid: trn-matchup-generation-stale
        title: Matchup analytics generation stale
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: (time() - max_over_time(transcendence_analytics_matchup_last_success_unixtime_seconds{job="transcendence-worker"}[24h])) and (max_over_time(transcendence_analytics_matchup_last_success_unixtime_seconds{job="transcendence-worker"}[24h]) > 0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 7200
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: No matchup generation has promoted for two hours
          description: The resumable matchup pipeline has not published a complete generation within two hourly cycles. Inspect refresh errors, resume attempt, database load, and runnable analytics-warm jobs.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      - uid: trn-matchup-generation-failures
        title: Matchup analytics generation repeatedly failing
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(increase(transcendence_analytics_matchup_refresh_events_total{job="transcendence-worker",phase="generation",result="error"}[2h]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A >= 2
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: Matchup generation failed at least twice in two hours
          description: The pipeline is resuming or abandoning generations repeatedly. Check the generation failure reason and batch split telemetry before increasing timeouts.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Web frontend metrics target down -------------------------------------------------------
      - uid: trn-web-down
        title: Web frontend metrics unavailable
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-web"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Transcendence web metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the Next.js web container for over 2 minutes. The frontend may be down, or browser performance telemetry may be unavailable.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Worker target down (also the DB/Redis-loss proxy) --------------------------------------
      - uid: trn-worker-down
        title: Worker down
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-worker"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Transcendence worker is not reporting to Prometheus
          description: The transcendence-worker target has been down for over 2 minutes — all ingestion/analytics jobs are halted. NB the worker crash-loops if Postgres is unreachable, so this also fires on a DB outage.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- PostgreSQL metrics target down ---------------------------------------------------------
      - uid: trn-postgres-exporter-down
        title: PostgreSQL metrics unavailable
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-postgres"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL metrics target is unavailable
          description: Prometheus cannot scrape postgres_exporter. PostgreSQL may be down, unreachable, or rejecting the monitoring role.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Redis metrics target down --------------------------------------------------------------
      - uid: trn-redis-exporter-down
        title: Redis metrics unavailable
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: up{job="transcendence-redis"}
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Redis metrics target is unavailable
          description: Prometheus cannot scrape redis_exporter. Redis may be down or unreachable from the monitoring network.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Database/cache saturation ---------------------------------------------------------------
      - uid: trn-postgres-connections-high
        title: PostgreSQL connections high
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(pg_stat_database_numbackends{datname="transcendence"}) / max(pg_settings_max_connections)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0.8
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connection use above 80%
          description: PostgreSQL has used over 80% of max_connections for 10 minutes. Preserve operator and migration headroom before increasing application pools.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      - uid: trn-redis-rejected-connections
        title: Redis rejecting connections
        condition: B
        for: 2m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: increase(redis_rejected_connections_total[5m])
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Redis has rejected client connections
          description: Redis rejected one or more connections in the last five minutes. Cache and distributed coordination may be degraded.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- API 5xx error ratio --------------------------------------------------------------------
      - uid: trn-api-5xx-ratio
        title: API 5xx error ratio high
        condition: B
        for: 5m
        # 0/0 (no traffic) yields NaN → no data → not an incident.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(rate(http_server_request_duration_seconds_count{job="transcendence-webapi",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="transcendence-webapi"}[5m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: WebAPI 5xx error ratio above 5%
          description: More than 5% of WebAPI responses have been 5xx for over 5 minutes — a backend fault (often DB/Redis) is degrading the API.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- API p95 latency ------------------------------------------------------------------------
      - uid: trn-api-latency-p95
        title: API p95 latency high
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="transcendence-webapi"}[5m])))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 1.5
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: WebAPI p95 request latency above 1.5s
          description: The WebAPI 95th-percentile request duration has exceeded 1.5s for over 10 minutes — reads are degraded.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Browser Core Web Vitals ---------------------------------------------------------------
      # Alert only after at least 20 observations in 30 minutes, so sparse traffic cannot page on
      # one slow device. The resulting alert instance retains the metric label (LCP, INP, or CLS).
      - uid: trn-web-vital-p75
        title: Browser Core Web Vital p75 degraded
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: ((histogram_quantile(0.75, sum by (metric, le) (rate(transcendence_web_vital_duration_milliseconds_bucket{metric="LCP"}[30m]))) > 2500) and on(metric) (sum by (metric) (increase(transcendence_web_vital_reports_total{metric="LCP"}[30m])) >= 20)) or ((histogram_quantile(0.75, sum by (metric, le) (rate(transcendence_web_vital_duration_milliseconds_bucket{metric="INP"}[30m]))) > 200) and on(metric) (sum by (metric) (increase(transcendence_web_vital_reports_total{metric="INP"}[30m])) >= 20)) or ((histogram_quantile(0.75, sum by (metric, le) (rate(transcendence_web_vital_cls_bucket[30m]))) > 0.1) and on(metric) (sum by (metric) (increase(transcendence_web_vital_reports_total{metric="CLS"}[30m])) >= 20))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: Browser p75 is above the Core Web Vitals good threshold
          description: Real-user p75 has exceeded LCP 2.5s, INP 200ms, or CLS 0.1 for at least 15 minutes with a minimum 20-report sample.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Host disk space low (node-exporter) ----------------------------------------------------
      # Pages BEFORE a full disk crash-loops Postgres (2026-07-19 incident). Takes the fullest real
      # filesystem's free ratio; fires under 15% free (>85% used) for 15m of slow-fill headroom.
      - uid: trn-disk-space-low
        title: Host disk space low
        condition: B
        for: 15m
        # If node-exporter is unreachable this rule can't judge disk — stay quiet (a separate concern),
        # don't misreport "disk low".
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: min(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) * 100
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 15
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: Host disk space below 15% free
          description: A host filesystem has under 15% free space for over 15 minutes. Free space (prune images, expand the CT disk via `pct resize`, or archive/prune old-patch match data) before Postgres runs out and crash-loops.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # --- Build Lab -------------------------------------------------------------------------------
      # Build Lab ships disabled (`Analytics:BuildLab:Enabled=false`), and the worker reports 0 for
      # every gauge while it is off or while no generation is in the relevant state. Each rule below
      # therefore guards on `> 0` and uses noDataState: OK, so a disabled feature never pages.

      # The dead-modeler detector. A generation is created in PendingDataset and only the Python
      # modeler can claim it (`BUILD_LAB_POLL_SECONDS`, default 300, so a healthy claim happens within
      # ~5 minutes). If the modeler container is not running, the row is never claimed, never leased,
      # and never reaped — the reaper only touches Modeling — so no other Build Lab rule can see it:
      # the Modeling gauge stays 0, no training-failure event is emitted, and the create job refuses to
      # create a second in-flight generation for the patch. Threshold 6h = 72x the poll interval, and
      # the create cron runs once a day (02:15), so a dead modeler pages the same morning while a claim
      # that is merely queued behind a still-running training run does not.
      - uid: trn-buildlab-unclaimed-generation
        title: Build Lab generation unclaimed by the modeler
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_generation_status_age_seconds{job="transcendence-worker",status="PendingDataset"}) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 21600
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: A pending Build Lab generation has waited over six hours for the modeler
          description: No modeler has leased the pending generation. Confirm transcendence-analytics-modeler is running (`docker compose --profile analytics-modeling up -d analytics-modeler`) and can reach the database; until it claims the row, no new generation can be created for this patch.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # Duration, not liveness. A generation in Modeling is owned by the modeler, which holds a
      # PostgreSQL session advisory lock for the whole run, so a dead modeler drops the lock with its
      # session and the next promote tick (`*/10 * * * *`) reaps the row within ~10 minutes. This gauge
      # is therefore how long a LIVE run has been going. Threshold 2700s says "far longer than a normal
      # generation": the only ways to sustain it are a genuinely slow run or a promote job that is not
      # running. It replaced a heartbeat-age reading whose renewal thread could be GIL-starved for
      # minutes, which reaped six consecutive healthy runs.
      - uid: trn-buildlab-modeling-wedged
        title: Build Lab generation wedged in Modeling
        condition: B
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_generation_status_age_seconds{job="transcendence-worker",status="Modeling"}) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 2700
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: A Build Lab generation has been Modeling for over 45 minutes
          description: A run has been Modeling far longer than a normal generation takes. This is duration, not a liveness failure - a dead modeler drops its Postgres session advisory lock and the reaper fails the row on the next promote tick. So a firing alert means the modeler is still alive and slow, or the promote job is not running. Check transcendence-analytics-modeler logs first, then that promote-build-lab-generation is enabled; a run stuck here also blocks creation of the next generation for that patch.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # One lost training run is the whole signal. Only a reaped Modeling lease emits this event, at most
      # one generation is in flight per patch, and the create cron runs once a day — so two failures in
      # six hours (the previous condition) could not happen even with a permanently dead modeler, while a
      # single event means the day's only training attempt was lost. The window is therefore a full day
      # and the condition is "any": increase() extrapolates over its range, so a single +1 step does not
      # reliably evaluate to exactly 1.
      - uid: trn-buildlab-training-failures
        title: Build Lab lost a training run
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(increase(transcendence_buildlab_generation_events_total{job="transcendence-worker",phase="training",result="error"}[24h]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: A Build Lab generation reached Failed during modeling in the last day
          description: A modeling lease was reaped, so that generation's training run is lost and the create job only retries tomorrow. Read the generation FailureReason and the modeler logs; never relax an Analytics:BuildLab threshold in response — build-lab-v1 refuses lowered gates by design.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # A promotion that fails its gates is normal and self-healing; a promotion that has not
      # succeeded for two days while a generation pipeline is running means the served estimates are
      # drifting away from the live patch.
      - uid: trn-buildlab-generation-stale
        title: Build Lab active generation stale
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_active_generation_age_seconds{job="transcendence-worker"}) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 172800
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: No Build Lab generation has promoted in two days
          description: The active generation is over 48h old. Public Adjusted WPA is still served (from that generation) but is increasingly stale against the live patch. Check candidate gate failures and dataset lag.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # Dataset lag = now - the active generation's frozen SourceCutoffUtc. Distinct from generation
      # age: a generation can promote quickly and still be trained on a week-old cutoff if the
      # timeline corpus stopped advancing.
      - uid: trn-buildlab-dataset-lag
        title: Build Lab dataset lag high
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_dataset_lag_seconds{job="transcendence-worker"}) > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 259200
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: Build Lab is serving estimates from a source cutoff over three days old
          description: The active generation's frozen source cutoff is more than 72h behind now. Timeline ingestion at schema v2 may have stalled, or generation creation is not running.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # An operator (or an automated guard) reverting the active pointer is always worth a message —
      # informational rather than a fault, so it stays at info severity.
      - uid: trn-buildlab-rollback
        title: Build Lab generation rolled back
        condition: B
        for: 0m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum(increase(transcendence_buildlab_generation_events_total{job="transcendence-worker",phase="rollback",result="success"}[15m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A >= 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: info
        annotations:
          summary: The Build Lab active generation pointer was rolled back
          description: A Ready or Retired generation was made active again. Expect served Adjusted WPA values and provenance to change; confirm this was intentional.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # A generation that promotes with zero publishable action estimates cannot happen (promotion
      # rejects it), so this only fires if the count collapses on an already-active generation —
      # i.e. the public surface silently went empty.
      - uid: trn-buildlab-no-published-estimates
        title: Build Lab active generation publishes nothing
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_published_estimates{job="transcendence-worker",kind="action"}) and (max(transcendence_buildlab_active_generation_age_seconds{job="transcendence-worker"}) > 0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 1
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: critical
        annotations:
          summary: The active Build Lab generation has no publishable action estimates
          description: An active generation is serving zero publishable estimates, so every Build Lab request returns unavailable. Inspect the evidence gates and consider rolling back to the previous generation.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # Coverage collapse, measured against the surface's own recent peak rather than an absolute floor:
      # during the initial ramp coverage only grows (so this cannot page while the corpus fills), and the
      # 20-scope floor on the 7d peak keeps a first, deliberately tiny generation out of scope. An empty
      # or disabled pipeline reports 0, whose peak is 0, so the `and` yields no series and the rule stays
      # Normal on noDataState: OK.
      - uid: trn-buildlab-coverage-collapse
        title: Build Lab champion-role coverage collapsed
        condition: B
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 604800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: (max(transcendence_buildlab_coverage_scopes{job="transcendence-worker",scope="champion_role"}) / clamp_min(max(max_over_time(transcendence_buildlab_coverage_scopes{job="transcendence-worker",scope="champion_role"}[7d])), 1)) and (max(max_over_time(transcendence_buildlab_coverage_scopes{job="transcendence-worker",scope="champion_role"}[7d])) >= 20)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 0.5
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: The active Build Lab generation covers under half the champion-role scopes it did this week
          description: Published champion-role coverage fell below 50% of its 7-day peak, so Build Lab silently stopped answering for champions it used to answer for even though the estimate count may still look healthy. Check the evidence gates, the generation's match count, and dataset lag.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # An invariant, not a tuning knob: promotion re-applies the evidence gates, so every publishable
      # row must carry an effective sample size at or above Analytics:BuildLab:MinimumEffectiveSampleSize
      # (v1 floor 500, and build-lab-v1 refuses to lower it). A weakest published cell under that floor
      # means grading did not run or did not apply. Nothing published reports 0, which the `> 0` filter
      # drops rather than treating as a violation.
      - uid: trn-buildlab-evidence-gate-breach
        title: Build Lab published an estimate below the evidence floor
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_effective_sample_size{job="transcendence-worker",stat="minimum"} > 0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A < 500
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: The weakest published Build Lab estimate is below the v1 effective-sample-size floor
          description: A publishable action estimate carries an effective sample size under 500, which promotion's evidence gates should have made impossible. Treat it as a grading or gate-application fault, not as a threshold to lower, and consider rolling back the generation.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder

      # The same shape of invariant for calibration: promotion rejects a candidate whose validation
      # metrics exceed Analytics:BuildLab:MaximumOverallEce (0.015) or MaximumTimeBandEce (0.025), so an
      # active generation reporting worse than that was published without those gates. An unreported or
      # unparseable metric is 0, which fails both comparisons and correctly stays quiet.
      - uid: trn-buildlab-calibration-breach
        title: Build Lab active generation exceeds its calibration gates
        condition: B
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max(transcendence_buildlab_calibration_error{job="transcendence-worker",metric="overall_ece"} > 0.015) or max(transcendence_buildlab_calibration_error{job="transcendence-worker",metric="max_time_band_ece"} > 0.025)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: math
              expression: $A > 0
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: __expr__
                uid: __expr__
        labels:
          severity: warning
        annotations:
          summary: The active Build Lab generation reports calibration error above the promotion gates
          description: The served generation's overall ECE is above 0.015 or its worst time-band ECE above 0.025, which promotion should have rejected. Every published Adjusted WPA is anchored on that calibrated score, so treat the numbers as untrustworthy and roll back.
        notification_settings:
          receiver: transcendence-discord
          group_by:
            - alertname
            - grafana_folder
